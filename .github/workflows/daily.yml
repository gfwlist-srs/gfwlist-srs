name: gfwlist-srs-daily

on:
  schedule:
    # 每日 01:17 UTC (北京 09:17), 避开整点/半点
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gfwlist-srs
  cancel-in-progress: false

jobs:
  # ------------------------------------------------ build: 下载 → 校验 → 转换(六目标) → 编译
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install sing-box
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download gfwlist
        run: |
          curl -fsSL --retry 3 -o gfwlist.b64 https://raw.githubusercontent.com/gfwlist/gfwlist/master/gfwlist.txt
          base64 -d gfwlist.b64 > gfwlist.txt

      - name: Validate input
        run: python3 tools/validate_input.py gfwlist.b64

      - name: Convert gfwlist -> rule-set json + audit
        run: python3 src/gfwlist2srs.py gfwlist.txt dist

      - name: Convert gfwlist -> Shadowrocket conf + audit
        run: python3 src/gfwlist2shadowrocket.py gfwlist.txt dist

      - name: Convert gfwlist -> multi-target (surge/clash/xray/qx) + audit
        run: python3 src/gfwlist2targets.py gfwlist.txt dist

      - name: Compile .srs
        run: |
          sing-box rule-set compile dist/gfwlist-block.json -o dist/gfwlist-block.srs
          sing-box rule-set compile dist/gfwlist-block-domain.json -o dist/gfwlist-block-domain.srs
          sing-box rule-set compile dist/gfwlist-exception.json -o dist/gfwlist-exception.srs

      - name: sing-box config check
        run: sing-box check -c examples/config.local.json

      - name: Upload dist (build output)
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload gfwlist input (gate 复用)
        uses: actions/upload-artifact@v7
        with:
          name: gfwlist-input
          path: gfwlist.txt
          retention-days: 7

  # ------------------------------------------------ gate: 六路对拍门禁 (并行)
  gate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: singbox,      cmd: "python3 tests/differential_test.py gfwlist.txt dist",          out: "mismatches.json" }
          - { target: shadowrocket, cmd: "python3 tests/differential_shadowrocket.py gfwlist.txt dist",  out: "mismatches-shadowrocket.json" }
          - { target: surge,        cmd: "python3 tests/differential_targets.py gfwlist.txt dist surge", out: "mismatches-surge.json" }
          - { target: clash,        cmd: "python3 tests/differential_targets.py gfwlist.txt dist clash", out: "mismatches-clash.json" }
          - { target: xray,         cmd: "python3 tests/differential_targets.py gfwlist.txt dist xray",  out: "mismatches-xray.json" }
          - { target: qx,           cmd: "python3 tests/differential_targets.py gfwlist.txt dist qx",    out: "mismatches-qx.json" }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test oracle dependencies
        run: pip install adblock adblockparser

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download gfwlist input
        uses: actions/download-artifact@v8
        with:
          name: gfwlist-input

      - name: Differential gate — ${{ matrix.target }}
        run: ${{ matrix.cmd }}

      - name: Upload mismatch report
        uses: actions/upload-artifact@v7
        with:
          name: mismatches-${{ matrix.target }}
          path: dist/${{ matrix.out }}
          retention-days: 7

  # ------------------------------------------------ publish: 全部门禁通过后提交 dist
  publish:
    needs: [build, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Merge mismatch reports
        uses: actions/download-artifact@v8
        with:
          pattern: mismatches-*
          path: /tmp/mm
          merge-multiple: true

      - name: Merge mismatch reports into dist
        run: cp /tmp/mm/*.json dist/

      - name: Commit dist if changed
        id: commit
        run: |
          git config user.name "gfwlist-srs-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "dist: gfwlist snapshot ${DATE}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in gfwlist-block.srs gfwlist-block-domain.srs gfwlist-exception.srs \
                   gfwlist-shadowrocket.conf gfwlist-ir.json \
                   gfwlist-block.list gfwlist-exception.list \
                   gfwlist-clash-block.yaml gfwlist-clash-exception.yaml \
                   gfwlist-xray.json gfwlist-quantumultx.list; do
            curl -fsS "https://purge.jsdelivr.net/gh/gfwlist-srs/gfwlist-srs@main/dist/$f" || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gfwlist-srs-dist
          path: dist/
          retention-days: 30
